  <style>
    :root {
      --font-primary: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      --bg-color: #0f172a;
      --bg-secondary: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --border-color: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(30, 41, 59, 0.7);
      --shadow-color: rgba(0, 0, 0, 0.3);
      --glass-border: 1px solid rgba(255, 255, 255, 0.1);
      --glass-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --btn-text-color: #ffffff;
      --hero-glow: rgba(var(--accent-rgb), 0.15);
      --accent-rgb: 99, 102, 241;
      --bg-rgb: 15, 23, 42;
      --white-rgb: 255, 255, 255;
      --black-rgb: 0, 0, 0;
      --gradient-primary: linear-gradient(-45deg, #6366f1, #e11d48, #22d3ee, #6366f1)
    }

    ::-webkit-scrollbar {
      width: 10px
    }

    ::-webkit-scrollbar-track {
      background: 0 0
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(var(--accent-rgb), .5);
      border-radius: 5px;
      border: 2px solid transparent;
      background-clip: content-box
    }

    ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(var(--accent-rgb), .8)
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: var(--font-primary);
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden
    }

    :focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 4px;
      border-radius: 4px
    }

    .skip-link {
      position: absolute;
      top: -40px;
      left: 10px;
      background: var(--accent-color);
      color: #fff;
      padding: 8px 16px;
      z-index: 2000;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      opacity: 0
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px
    }

    .welcome-section {
      padding: 160px 0 80px;
      min-height: 80vh;
      display: flex;
      align-items: center
    }

    .welcome-container {
      text-align: center
    }

    .welcome-content {
      max-width: 800px;
      margin: 0 auto
    }

    .welcome-title {
      font-size: 3.5rem;
      line-height: 1.2;
      font-weight: 800;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--text-primary) 0, var(--accent-color) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .welcome-desc {
      font-size: 1.5rem;
      color: var(--text-secondary);
      margin-bottom: 60px
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      max-width: 900px;
      margin: 0 auto
    }

    .app-card {
      background: var(--card-bg);
      border: var(--glass-border);
      backdrop-filter: blur(12px);
      padding: 40px 32px;
      border-radius: 24px;
      text-align: center;
      text-decoration: none;
      color: var(--text-primary);
      box-shadow: var(--shadow-color) 0 10px 30px;
      position: relative;
      overflow: hidden
    }

    .app-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--accent-color) 0, transparent 100%);
      opacity: 0
    }

    .app-card-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      position: relative;
      z-index: 1
    }

    .app-card-icon img {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover
    }

    .app-card h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      font-weight: 600;
      position: relative;
      z-index: 1
    }

    .app-card p {
      color: var(--text-secondary);
      margin-bottom: 16px;
      font-size: .95rem;
      position: relative;
      z-index: 1
    }

    .app-card-arrow {
      font-size: 1.5rem;
      color: var(--accent-color);
      display: inline-block;
      position: relative;
      z-index: 1
    }

    @media (max-width:768px) {
      .welcome-title {
        font-size: 2.5rem
      }

      .welcome-desc {
        font-size: 1.2rem
      }

      .app-grid {
        grid-template-columns: 1fr
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .fade-in {
      animation: .6s ease-out forwards fadeIn
    }

    @keyframes gradientFlow {
      0% {
        background-position: 0 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0 50%
      }
    }

    .text-gradient-animated {
      background: var(--gradient-primary);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: 6s infinite gradientFlow
    }

    #header-placeholder {
      min-height: 80px
    }

    .welcome-title,
    h1,
    h2 {
      text-wrap: balance
    }

    @media (prefers-reduced-motion:reduce) {
      .fade-in {
        animation: none;
        opacity: 1
      }

      .text-gradient-animated {
        animation: none
      }

      *,
      ::after,
      ::before {
        animation-duration: 0s !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important
      }
    }
  </style>
