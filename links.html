        :root {
            --font-primary: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;

            --bg-rgb: 15, 23, 42;

            --black-rgb: 0, 0, 0;
            --gradient-primary: linear-gradient(-45deg, #6366f1, #e11d48, #22d3ee, #6366f1)
        }

        ::-webkit-scrollbar {
            width: 10px
        }

        ::-webkit-scrollbar-track {
            background: 0 0
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(var(--accent-rgb), .5);
            border-radius: 5px;
            border: 2px solid transparent;
            background-clip: content-box
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(var(--accent-rgb), .8)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden
        }

        :focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 4px;
            border-radius: 4px
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 10px;
            background: var(--accent-color);
            color: #fff;
            padding: 8px 16px;
            z-index: 2000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            opacity: 0
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .fade-in {
            animation: .6s ease-out forwards fadeIn
        }

        #header-placeholder {
            min-height: 80px
        }

        @media (prefers-reduced-motion:reduce) {
            .fade-in {
                animation: none;
                opacity: 1
            }

            *,
            ::after,
            ::before {
                animation-duration: 0s !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important
            }
        }

        .links-container {
            padding-top: 120px;
            padding-bottom: 60px;
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 680px;
            margin: 0 auto;
            width: 100%
        }

        .profile-section {
            text-align: center;
            margin-bottom: 48px;
            width: 100%
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 24px;
            border: 4px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 0, 0, .2);
            object-fit: cover
        }

        .profile-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-primary) 0, var(--accent-color) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .profile-bio {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 90%;
            margin: 0 auto 24px
        }

        .profile-share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: 0 0;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            font-size: .95rem;
            font-weight: 600;
            backdrop-filter: blur(4px)
        }

        .profile-share-btn svg {
            width: 18px;
            height: 18px
        }

        .links-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            padding: 0 20px
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 24px;
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 50px;
            color: var(--text-primary);
            text-decoration: none;
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow-color) 0 4px 6px;
            position: relative;
            overflow: hidden
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 600;
            font-size: 1.1rem
        }

        .link-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            color: var(--accent-color)
        }

        .link-icon svg {
            width: 28px;
            height: 28px
        }

        .link-arrow {
            color: var(--text-secondary);
            opacity: .5
        }

        h1 {
            text-wrap: balance
        }
