version: 2
updates:
  # NPM 依賴更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    # 限制開啟的 PR 數量，避免過多更新請求
    open-pull-requests-limit: 5
    # 忽略主版本更新，只更新小版本和補丁版本
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # 標籤分類
    labels:
      - "dependencies"
      - "automated"
    # Commit 訊息格式
    commit-message:
      prefix: "chore(deps)"
