    <style>
        :root {
            --font-primary: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            --bg-color: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(30, 41, 59, 0.7);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --btn-text-color: #ffffff;
            --hero-glow: rgba(var(--accent-rgb), 0.15);
            --accent-rgb: 99, 102, 241;
            --bg-rgb: 15, 23, 42;
            --white-rgb: 255, 255, 255;
            --black-rgb: 0, 0, 0;
            --gradient-primary: linear-gradient(-45deg, #6366f1, #e11d48, #22d3ee, #6366f1)
        }

        ::-webkit-scrollbar {
            width: 10px
        }

        ::-webkit-scrollbar-track {
            background: 0 0
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(var(--accent-rgb), .5);
            border-radius: 5px;
            border: 2px solid transparent;
            background-clip: content-box
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(var(--accent-rgb), .8)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden
        }

        :focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 4px;
            border-radius: 4px
        }

        .skip-link {
            position: absolute;
            top: -40px;
            left: 10px;
            background: var(--accent-color);
            color: #fff;
            padding: 8px 16px;
            z-index: 2000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            opacity: 0
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px
        }

        .welcome-title {
            font-size: 3.5rem;
            line-height: 1.2;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--text-primary) 0, var(--accent-color) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: var(--btn-text-color);
            box-shadow: 0 4px 14px 0 rgba(var(--accent-rgb), .39)
        }

        .btn-outline {
            background: 0 0;
            border: 1px solid var(--text-primary);
            color: var(--text-primary);
            margin-left: 10px
        }

        @media (max-width:768px) {
            .welcome-title {
                font-size: 2.5rem
            }
        }

        .btn {
            position: relative;
            overflow: hidden
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, .2);
            border-radius: 50%;
            transform: translate(-50%, -50%)
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .fade-in {
            animation: .6s ease-out forwards fadeIn
        }

        #header-placeholder {
            min-height: 80px
        }

        #footer-placeholder {
            min-height: 100px
        }

        .btn-content-flex {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .welcome-title,
        h1,
        h2 {
            text-wrap: balance
        }

        @media (prefers-reduced-motion:reduce) {
            .fade-in {
                animation: none;
                opacity: 1
            }

            *,
            ::after,
            ::before {
                animation-duration: 0s !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important
            }
        }
    </style>
