# Rate Limiting Zone
# 10r/s per IP, 10MB memory (approx 160k IPs)
limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # Security Headers
    # =========================================================================

    # Include shared security headers
    include /etc/nginx/conf.d/security_headers.conf;

    # HSTS (Enable ONLY if using SSL/TLS. Comment out for localhost/HTTP)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # =========================================================================
    # Compression (Gzip & Brotli)
    # =========================================================================

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Brotli (Requires ngx_brotli module)
    # Uncomment if your Nginx environment supports Brotli
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # =========================================================================
    # Routing & Caching
    # =========================================================================

    location / {
        # Rate Limit: Burst 20, No Delay
        limit_req zone=one burst=20 nodelay;
        
        try_files $uri $uri/ /404.html;
    }

    # Cache Control: Immutable Static Assets (Images, Fonts, Hashed JS/CSS)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|gif|ico|png|jpg|jpeg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Ensure Security Headers are still added
        include /etc/nginx/conf.d/security_headers.conf;
        
        access_log off;
    }

    # Cache Control: Service Worker (Never Cache)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security_headers.conf;
        expires 0;
    }

    # Cache Control: Manifest & HTML (Short Cache)
    location ~* \.(?:json|html)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        include /etc/nginx/conf.d/security_headers.conf;
    }

    error_page 404 /404.html;
}
