server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # Security Headers
    # =========================================================================

    # HSTS (Enable ONLY if using SSL/TLS. Comment out for localhost/HTTP)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Anti-Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (Basic)
    # Allows scripts/styles from self and common analytics/fonts resources.
    # 'unsafe-inline' is often needed for Astro's inline scripts unless strict hashes are used.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.google-analytics.com;" always;

    # Permissions Policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # =========================================================================
    # Compression (Gzip & Brotli)
    # =========================================================================

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Brotli (Requires ngx_brotli module)
    # Uncomment if your Nginx environment supports Brotli
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # =========================================================================
    # Routing & Caching
    # =========================================================================

    location / {
        try_files $uri $uri/ /404.html;
    }

    # Cache Control: Immutable Static Assets (Images, Fonts, Hashed JS/CSS)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|gif|ico|png|jpg|jpeg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache Control: Service Worker (Never Cache)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Cache Control: Manifest & HTML (Short Cache)
    location ~* \.(?:json|html)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    error_page 404 /404.html;
}
